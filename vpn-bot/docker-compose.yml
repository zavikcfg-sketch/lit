services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: vpnbot-bot:latest
    container_name: vpnbot-bot
    restart: unless-stopped
    env_file: .env
    environment:
      BOT_HTTP_PORT: 8088
    ports:
      # наружу не публикуем — healthcheck ходит локально
      - "127.0.0.1:8088:8088"
    volumes:
      - bot_data:/app/data
    stop_grace_period: 30s

  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
    image: vpnbot-admin:latest
    container_name: vpnbot-admin
    restart: unless-stopped
    env_file: .env
    environment:
      ADMIN_PORT: 8090
    ports:
      # Caddy проксирует admin.panel.litenergyapp.store -> 127.0.0.1:8090
      - "127.0.0.1:8090:8090"
    volumes:
      - bot_data:/app/data
    stop_grace_period: 30s

volumes:
  bot_data:
